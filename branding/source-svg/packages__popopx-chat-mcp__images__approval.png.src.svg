1021" text-anchor="middle">My Agent</text><circle cx="664" cy="172" r="5" fill="#7A2BBE"/><circle cx="681" cy="172" r="5" fill="#7A2BBE"/><circle cx="698" cy="172" r="5" fill="#7A2BBE"/><path d="M26 204 L716 204" fill="none" stroke="#DED6E8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="300" r="26" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="640" cy="300" r="56" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="640" cy="300" r="86" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="640" cy="300" r="116" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="110" cy="1180" r="26" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="110" cy="1180" r="56" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="110" cy="1180" r="86" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="110" cy="1180" r="116" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="640" cy="300" r="5" fill="#7A2BBE" opacity="0.18"/><circle cx="110" cy="1180" r="5" fill="#7A2BBE" opacity="0.18"/><rect x="44" y="214" width="516.2" height="172" rx="30" fill="#FFFFFF"/><text x="68" y="270" font-family="Helvetica Neue" font-size="32" fill="#171021">Supervise your AI agent here:</text><text x="68" y="316" font-family="Helvetica Neue" font-size="32" fill="#171021">approve or reject its connections</text><text x="68" y="362" font-family="Helvetica Neue" font-size="32" fill="#171021">and messages with one tap.</text><text x="44" y="434" font-family="Helvetica Neue" font-size="28" fill="#6E6676">Messages, files and calls are protected by</text><text x="44" y="474" font-family="Helvetica Neue" font-weight="bold" font-size="28" fill="#4C4457">end-to-end encryption</text><text x="44" y="514" font-family="Helvetica Neue" font-size="28" fill="#6E6676">with perfect forward secrecy, repudiation</text><text x="44" y="554" font-family="Helvetica Neue" font-size="28" fill="#6E6676">and break-in recovery.</text><text x="44" y="606" font-family="Helvetica Neue" font-size="28" fill="#6E6676">My Agent connected 20:21</text><rect x="208.3" y="640" width="489.7" height="126" rx="30" fill="#E9DDF5"/><text x="232.3" y="696" font-family="Helvetica Neue" font-size="32" fill="#171021">I'm your agent. I ask here</text><text x="232.3" y="742" font-family="Helvetica Neue" font-size="32" fill="#171021">before I connect or send.</text><text x="674" y="742" font-family="Helvetica Neue" font-size="26" fill="#9A93A3" text-anchor="end">20:21</text><rect x="44" y="786" width="552.4" height="126" rx="30" fill="#FFFFFF"/><text x="68" y="842" font-family="Helvetica Neue" font-size="32" fill="#171021">I connected to #security, as myself.</text><text x="68" y="888" font-family="Helvetica Neue" font-size="32" fill="#171021">Approved by alice.</text><text x="572.4" y="888" font-family="Helvetica Neue" font-size="26" fill="#9A93A3" text-anchor="end">20:25</text><rect x="374.2" y="932" width="323.8" height="80" rx="30" fill="#E9DDF5"/><text x="398.2" y="988" font-family="Menlo" font-size="32" fill="#7A2BBE">/approve 1</text><text x="674" y="988" font-family="Helvetica Neue" font-size="26" fill="#9A93A3" text-anchor="end">20:25</text><text x="44" y="1056" font-family="Helvetica Neue" font-size="26" fill="#6E6676">My Agent</text><text x="698" y="1056" font-family="Helvetica Neue" font-size="26" fill="#6E6676" text-anchor="end">owner</text><rect x="44" y="1078" width="599.8" height="218" rx="30" fill="#FFFFFF"/><text x="68" y="1134" font-family="Helvetica Neue" font-size="32" fill="#171021">I want to send a message to #security:</text><text x="68" y="1180" font-family="Menlo" font-size="32" fill="#171021">security</text><text x="68" y="1226" font-family="Menlo" font-size="32" fill="#7A2BBE">/approve @3 4,/approve</text><text x="68" y="1272" font-family="Menlo" font-size="32" fill="#7A2BBE">@3 all or /reject @3 4</text><text x="619.8" y="1272" font-family="Helvetica Neue" font-size="26" fill="#9A93A3" text-anchor="end">20:44</text><rect x="26" y="1338" width="690" height="100" rx="0" fill="#EFE9F4"/><path d="M26 1338 L716 1338" fill="none" stroke="#DED6E8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 1398 l16 -26 M78 1398 l16 -26" fill="none" stroke="#7A2BBE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 1406 v-22 a11 11 0 0 1 22 0 v26 a14 14 0 0 1 -28 0 v-20 a9 9 0 0 1 18 0 v18" fill="none" stroke="#7A2BBE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="166" y="1366" width="524" height="62" rx="31" fill="#FFFFFF" stroke="#E2DAEC" stroke-width="1.5"/><path d="M598 1378 v16 q0 11 11 11 q11 0 11 -11 v-16 q0 -11 -11 -11 q-11 0 -11 11 z M594 1408 q5 13 15 13 q10 0 15 -13 M609 1419 v11" fill="none" stroke="#7A2BBE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M658 1376 l-13 22 h11 l-5 20 l18 -26 h-11 z" fill="#7A2BBE"/></svg>