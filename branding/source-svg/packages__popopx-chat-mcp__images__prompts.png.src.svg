<svg xmlns="http://www.w3.org/2000/svg" width="742" height="1489" viewBox="0 0 742 1489"><rect x="0" y="0" width="742" height="1489" rx="0" fill="#FFFFFF"/><rect x="6" y="6" width="730" height="1477" rx="112" fill="#15151A" stroke="#5C5C66" stroke-width="3"/><rect x="16" y="16" width="710" height="1457" rx="104" fill="#0C0C10"/><rect x="26" y="26" width="690" height="1437" rx="94" fill="#F5F2F8"/><rect x="2" y="300" width="6" height="62" rx="3" fill="#4A4A52"/><rect x="2" y="400" width="6" height="110" rx="3" fill="#4A4A52"/><rect x="2" y="530" width="6" height="110" rx="3" fill="#4A4A52"/><rect x="734" y="430" width="6" height="150" rx="3" fill="#4A4A52"/><rect x="250" y="26" width="242" height="66" rx="33" fill="#0C0C10"/><rect x="300" y="52" width="96" height="12" rx="6" fill="#232329"/><circle cx="440" cy="59" r="9" fill="#1A1A20"/><circle cx="440" cy="59" r="4" fill="#2E2E38"/><text x="96" y="92" font-family="Helvetica Neue" font-weight="500" font-size="34" fill="#171021">21:22</text><rect x="548" y="80" width="9" height="12" rx="2.5" fill="#171021"/><rect x="561" y="75" width="9" height="17" rx="2.5" fill="#171021"/><rect x="574" y="70" width="9" height="22" rx="2.5" fill="#171021"/><rect x="587" y="65" width="9" height="27" rx="2.5" fill="#171021"/><path d="M600 80 a30 30 0 0 1 40 0 M607 88 a19 19 0 0 1 26 0" fill="none" stroke="#171021" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="94" r="4.5" fill="#171021"/><rect x="654" y="68" width="46" height="24" rx="7" fill="none" stroke="#171021" stroke-width="2"/><rect x="658" y="72" width="30" height="16" rx="4" fill="#171021"/><rect x="703" y="75" width="4" height="10" rx="2" fill="#171021"/><rect x="26" y="116" width="690" height="88" rx="0" fill="#EFE9F4"/><path d="M78 148 l-24 24 l24 24" fill="none" stroke="#7A2BBE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="371" y="178" font-family="Helvetica Neue" font-weight="500" font-size="40" fill="#171021" text-anchor="middle">My Agent</text><path d="M596 154 q-8 20 10 34 q16 12 26 4 q5 -5 11 0 l9 9 q5 7 -3 12 q-20 12 -46 -8 q-24 -22 -16 -48 q3 -9 11 -9 l9 9 q5 6 0 11 z" fill="none" stroke="#7A2BBE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="172" r="5" fill="#7A2BBE"/><circle cx="681" cy="172" r="5" fill="#7A2BBE"/><circle cx="698" cy="172" r="5" fill="#7A2BBE"/><path d="M26 204 L716 204" fill="none" stroke="#DED6E8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="300" r="26" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="640" cy="300" r="56" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="640" cy="300" r="86" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="640" cy="300" r="116" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="110" cy="1180" r="26" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="110" cy="1180" r="56" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="110" cy="1180" r="86" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="110" cy="1180" r="116" fill="none" stroke="#7A2BBE" stroke-width="1.5" opacity="0.07"/><circle cx="640" cy="300" r="5" fill="#7A2BBE" opacity="0.18"/><circle cx="110" cy="1180" r="5" fill="#7A2BBE" opacity="0.18"/><text x="371" y="242" font-family="Helvetica Neue" font-size="28" fill="#6E6676" text-anchor="middle">Sun, 15 Nov</text><text x="44" y="294" font-family="Helvetica Neue" font-size="28" fill="#6E6676">Messages, files and calls are protected by</text><text x="44" y="330" font-family="Helvetica Neue" font-weight="bold" font-size="28" fill="#4C4457">quantum resistant e2e encryption</text><text x="44" y="366" font-family="Helvetica Neue" font-size="28" fill="#6E6676">with perfect forward secrecy, repudiation</text><text x="44" y="402" font-family="Helvetica Neue" font-size="28" fill="#6E6676">and break-in recovery.</text><rect x="44" y="422" width="526.4" height="218" rx="30" fill="#FFFFFF"/><text x="68" y="478" font-family="Helvetica Neue" font-size="32" fill="#171021">I'm your agent, connected as you</text><text x="68" y="524" font-family="Helvetica Neue" font-size="32" fill="#171021">asked in Claude Code. I'll act on</text><text x="68" y="570" font-family="Helvetica Neue" font-size="32" fill="#171021">your prompts here, except</text><text x="68" y="616" font-family="Helvetica Neue" font-size="32" fill="#171021">security-sensitive ones.</text><rect x="252.1" y="654" width="445.9" height="80" rx="30" fill="#E9DDF5"/><text x="276.1" y="710" font-family="Helvetica Neue" font-size="32" fill="#171021">are the tests passing?</text><text x="674" y="710" font-family="Helvetica Neue" font-size="26" fill="#9A93A3" text-anchor="end">21:20</text><rect x="44" y="746" width="303.7" height="110" rx="30" fill="#E7E2EE"/><text x="68" y="796" font-family="Helvetica Neue" font-size="26" fill="#6E6676">you</text><text x="68" y="832" font-family="Helvetica Neue" font-size="26" fill="#171021">are the tests passing?</text><rect x="44" y="858" width="592.9" height="172" rx="30" fill="#FFFFFF"/><text x="68" y="914" font-family="Helvetica Neue" font-size="32" fill="#171021">Yes: all 180 unit tests pass.</text><text x="68" y="960" font-family="Helvetica Neue" font-size="32" fill="#171021">Should I run the end-to-end tests</text><text x="68" y="1006" font-family="Helvetica Neue" font-size="32" fill="#171021">too? They take about 3 minutes.</text><text x="612.9" y="1006" font-family="Helvetica Neue" font-size="26" fill="#9A93A3" text-anchor="end">21:21</text><rect x="516.5" y="1044" width="181.5" height="80" rx="30" fill="#E9DDF5"/><text x="540.5" y="1100" font-family="Helvetica Neue" font-size="32" fill="#171021">Yes</text><text x="674" y="1100" font-family="Helvetica Neue" font-size="26" fill="#9A93A3" text-anchor="end">21:22</text><rect x="44" y="1136" width="90.4" height="110" rx="30" fill="#E7E2EE"/><text x="68" y="1186" font-family="Helvetica Neue" font-size="26" fill="#6E6676">you</text><text x="68" y="1222" font-family="Helvetica Neue" font-size="26" fill="#171021">Yes</text><rect x="44" y="1248" width="407.4" height="80" rx="30" fill="#FFFFFF"/><text x="68" y="1304" font-family="Helvetica Neue" font-size="32" fill="#171021">Running them now.</text><text x="427.4" y="1304" font-family="Helvetica Neue" font-size="26" fill="#9A93A3" text-anchor="end">21:22</text><rect x="26" y="1338" width="690" height="100" rx="0" fill="#EFE9F4"/><path d="M26 1338 L716 1338" fill="none" stroke="#DED6E8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 1398 l16 -26 M78 1398 l16 -26" fill="none" stroke="#7A2BBE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 1406 v-22 a11 11 0 0 1 22 0 v26 a14 14 0 0 1 -28 0 v-20 a9 9 0 0 1 18 0 v18" fill="none" stroke="#7A2BBE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="166" y="1366" width="524" height="62" rx="31" fill="#FFFFFF" stroke="#E2DAEC" stroke-width="1.5"/><path d="M598 1378 v16 q0 11 11 11 q11 0 11 -11 v-16 q0 -11 -11 -11 q-11 0 -11 11 z M594 1408 q5 13 15 13 q10 0 15 -13 M609 1419 v11" fill="none" stroke="#7A2BBE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M658 1376 l-13 22 h11 l-5 20 l18 -26 h-11 z" fill="#7A2BBE"/></svg>