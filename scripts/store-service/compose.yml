services:
  store-service:
    image: simplex-store-service:latest
    build:
      context: ../..
      dockerfile: scripts/store-service/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    restart: on-failure:5
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    tty: true
    network_mode: host
    command:
      - "-d"
      - "${BADGE_DB_CONN:-postgresql://simplex@127.0.0.1:5432/badge_service}"
      - "--create-schema"
      - "--yes-migrate"
      - "--service-config"
      - "/etc/simplex-store-service/store_service.ini"
    volumes:
      - &config
        type: bind
        source: ./config
        target: /etc/simplex-store-service
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      store-service-export: { condition: service_completed_successfully }
    stop_grace_period: 10s

  store-service-export:
    image: simplex-store-service:latest
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    network_mode: none
    command:
      - "--export-webapp"
      - "--service-config"
      - "/etc/simplex-store-service/store_service.ini"
    volumes:
      - *config
      - ./badges:/srv/badges-export
      - ./names:/srv/names-export
