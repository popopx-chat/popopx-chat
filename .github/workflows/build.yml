name: build

on:
  push:
    branches:
      - master
      - stable
    tags:
      - "v*"
      - "!*-fdroid"
      - "!*-armv7a"
  pull_request:
    paths:
      - "src/**"
      - "apps/popopx-chat/**"
      - "apps/multiplatform/**"
      - "apps/ios/**"
      - "tests/**"
      - "bots/src/**"
      - "popopx-chat.cabal"
      - "cabal.project"
      - "Dockerfile*"
      - "scripts/ci/*.sh"
      - "scripts/ci/ios-stub-libs.sh"
      - "scripts/ci/ios-stub-mlpackage.sh"
      - "scripts/ci/fixtures/**"
      - "scripts/desktop/**"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
    types: [opened, synchronize, reopened, ready_for_review]
  # The legs a master push deliberately skips (build-macos, build-windows, build-linux-full,
  # build-linux-push, build-linux-ghc8) were only ever reachable on a tag push - which is the one
  # moment none of them may fail for the first time. This is the sweep that finds the breakage while
  # it is still cheap. Weekly rather than nightly: the macOS pool they queue on is the same pool that
  # capacity-cancelled build-ios six runs in a row, and a nightly macOS pair competes with every push
  # for it.
  schedule:
    - cron: '45 4 * * 1'
  workflow_dispatch:
    inputs:
      tests:
        description: "hspec match patterns, one per line; empty runs the whole suite"
        type: string
        default: ""
      run_all:
        description: "also run the legs a push skips: macOS, Windows, full/push/ghc8 matrices"
        type: boolean
        default: false
      base:
        description: the branch that the changes are compared with
        type: string
        default: master

env:
  opt: ${{ github.event_name == 'push' && 'O2' || 'O0' }}
  ghc_options: ${{ github.event_name != 'push' && '--ghc-options=-O0' || '' }}
  release: ${{ startsWith(github.ref, 'refs/tags/v') }}
  branch: ${{ github.base_ref || github.ref_name }}
  cache_o0: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/stable') }}
  ZSTD_CLEVEL: 9

# This workflow uses custom actions (prepare-build and prepare-release) defined in:
# 
# .github/actions/
# ├── prepare-build
# │   └── action.yml
# └── prepare-release
#     └── action.yml

# Important!
# Do not use always(), it makes build unskippable.
# See: https://github.com/actions/runner/issues/1846#issuecomment-1246102753

jobs:

# =============================
#       Global variables
# =============================

# That is the only and less hacky way to setup global variables
# to use in strategy matrix (env:/YAML anchors doesn't work).
# See: https://github.com/orgs/community/discussions/56787#discussioncomment-6041789
#      https://github.com/actions/runner/issues/1182
#      https://stackoverflow.com/a/77549656

  variables:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      GHC_VER: 9.6.3
      JAVA_VER: 17
    steps:
      - name: Dummy job when we have just simple variables
        if: false
        run: echo

# =============================
#       Create release
# =============================

# Create release, but only if it's triggered by tag push.
# On pull requests and other pushes, this job will always complete.

  maybe-release:
    timeout-minutes: 30
    # The repository's default workflow token is read-only (actions/permissions/workflow = read).
    # Create release below runs on that token, so without this grant it answers 403 Resource not
    # accessible by integration - measured on popopxmq run 43575140034, the same inherited step -
    # and a red maybe-release skips every build leg, so no asset could ever be attached.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      haskell: ${{ steps.changes.outputs.haskell }}
      kotlin: ${{ steps.changes.outputs.kotlin }}
      ios: ${{ steps.changes.outputs.ios }}
      # `full` is the one switch that opens the legs `reduced` keeps shut. It is deliberately not
      # derived from `reduced`: that expression is read in ten places, including the Kotlin-only leg
      # selection (build-linux `if:` and `matrix.kotlin`) and the "Free disk space" step, so widening
      # it would re-shuffle jobs that have nothing to do with a full sweep.
      full: ${{ steps.changes.outputs.full }}
      reduced: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == true || (github.event_name == 'push' && github.ref_type == 'branch' && github.repository != 'simplex-chat/simplex-chat') }}
    steps:
      - name: Reject a manual run on a tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        run: |
          echo "::error::A manual run starts on a branch; to retry a release, re-run the jobs of its tag push."
          exit 1

      - name: Clone project
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check changes
        id: changes
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base }}
          RUN_ALL: ${{ inputs.run_all }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # `full` is the switch that says "run the legs a normal push skips". A scheduled sweep always
          # means that. A manual run means it only with the run_all switch, and run_all also has to
          # force the change flags: a dispatch on master compares HEAD against its own merge base, so
          # every flag comes out false and the sweep would report every leg skipped while building
          # nothing - the same green-that-ran-nothing W1 removed from the test step.
          full=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            full=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_ALL" = "true" ]; then
            full=true
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="HEAD^1"
              ;;
            workflow_dispatch)
              base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$GITHUB_REF_NAME" --jq .merge_base_commit.sha)
              git fetch -q --depth=1 origin "$base"
              ;;
            *)
              { echo "haskell=true"; echo "kotlin=true"; echo "ios=true"; echo "full=$full"; } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          has_changes() { ! git diff --quiet "$base" HEAD -- "$@" >/dev/null 2>&1; }
          hs=false; has_changes src apps/popopx-chat tests bots/src popopx-chat.cabal cabal.project Dockerfile* scripts .github && hs=true
          kt=false; has_changes apps/multiplatform Dockerfile* .github && kt=true
          # PopopxTorKit is listed here because the job that tests it is this one; without the path, a
          # Tor-only change would set none of the three flags and its 85 tests would never run.
          io=false; has_changes apps/ios apps/macos/PopopxTorKit scripts/ci/ios-stub-libs.sh scripts/ci/ios-stub-mlpackage.sh && io=true
          if [ "$full" = "true" ]; then hs=true; kt=true; io=true; fi
          { echo "haskell=$hs"; echo "kotlin=$kt"; echo "ios=$io"; echo "full=$full"; } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        # Pinned to a commit: this action creates the release that every build job then writes into.
        uses: simplex-chat/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          # Hand-authored, not generated: this fork's first tag shares no ancestor with any
          # tag of ours, so a changelog builder has nothing to diff. The release-hashes job
          # appends the SHA-256 of every asset once all the build legs have finished.
          body_path: .github/release_body.md
          # A pre-release is invisible to releases/latest, which is what install.sh and
          # reproduce-schedule.yml resolve - so the download links only work with this off.
          prerelease: false
          files: |
            LICENSE
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =============================
#    Compliance checks
# =============================

  check-smp-links:
    name: "SMP link compliance"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v6

      - name: Check for bare popopx.im URLs
        run: |
          chmod 755 scripts/ci/check-smp-links.sh
          ./scripts/ci/check-smp-links.sh

  check-brand-clean:
    name: "Brand compliance"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v6

      - name: Check for legacy upstream branding violations
        run: |
          chmod 755 scripts/ci/check-brand-clean.sh
          ./scripts/ci/check-brand-clean.sh

      # The second launch of the app throws when an offered SMP host falls outside
      # `operatorPopopxChat.serverDomains` (the chain is in the script's docstring). Nothing else in CI
      # covers it, and the script went silently vacuous once over a renamed definition — it now exits 1
      # on an empty census, so a pass here is a count, not a missing grep.
      - name: Check the server preset domain invariant
        run: python3 scripts/ci/preset-domain-invariant.py HEAD

# =========================
#        Linux Build
# =========================

  build-linux:
    name: "build-linux: ubuntu-${{ matrix.os }}-${{ matrix.arch }} (CLI,Desktop), GHC: ${{ matrix.ghc }}"
    timeout-minutes: 300
    needs: [maybe-release, variables, check-smp-links, check-brand-clean]
    if: needs.maybe-release.outputs.haskell == 'true' || (needs.maybe-release.outputs.reduced == 'true' && needs.maybe-release.outputs.kotlin == 'true')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    env:
      image_cache: ghcr.io/${{ github.repository_owner }}/popopx-chat-build-cache:${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}
      source_hashes: dist-newstyle/sources.sha256
    concurrency: &linux-concurrency
      group: ${{ github.workflow }}-${{ github.ref }}-linux-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.ghc }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 22.04
            os_underscore: 22_04
            arch: x86_64
            runner: "ubuntu-22.04"
            should_run: ${{ needs.maybe-release.outputs.haskell == 'true' }}
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            hash: 'sha256:5c8b2c0a6c745bc177669abfaa716b4bc57d58e2ea3882fb5da67f4d59e3dda5'
            kotlin: ${{ needs.maybe-release.outputs.reduced == 'true' && needs.maybe-release.outputs.kotlin == 'true' }}
    steps: &linux-steps
      - name: Checkout Code
        if: matrix.should_run == true || matrix.kotlin == true
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup swap
        if: matrix.ghc == '8.10.7' && matrix.should_run == true
        uses: ./.github/actions/swap
        with:
          swap-size-gb: 30

      - name: Get UID and GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT

      # Otherwise we run out of disk space with Docker build
      - name: Free disk space
        if: (matrix.should_run == true || matrix.kotlin == true) && needs.maybe-release.outputs.reduced != 'true'
        shell: bash
        run: ./scripts/ci/linux_util_free_space.sh

      - name: Set up Docker Buildx
        if: matrix.should_run == true || matrix.kotlin == true
        uses: simplex-chat/docker-setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: (matrix.should_run == true || matrix.kotlin == true) && env.release != 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Compute image cache week
        id: week
        if: (matrix.should_run == true || matrix.kotlin == true) && env.release != 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build and cache Docker image
        if: matrix.should_run == true || matrix.kotlin == true
        uses: simplex-chat/docker-build-push-action@v6
        with:
          context: .
          load: true
          file: Dockerfile.build
          tags: build/${{ matrix.os }}:latest
          build-args: |
            TAG=${{ matrix.os }}
            HASH=${{ matrix.hash }}
            GHC=${{ matrix.ghc }}
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: ${{ env.release != 'true' && format('type=registry,ref={0}-{1}', env.image_cache, steps.week.outputs.week) || '' }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && format('type=registry,ref={0}-{1},mode=max,ignore-error=true', env.image_cache, steps.week.outputs.week) || '' }}

      # Docker needs these flags for AppImage build:
      # --device /dev/fuse
      # --cap-add SYS_ADMIN
      # --security-opt apparmor:unconfined
      - name: Start container
        if: matrix.should_run == true || matrix.kotlin == true
        shell: bash
        run: |
          mkdir -p ~/.cabal
          docker run -t -d \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            --name builder \
            -e CABAL_DIR=/home/builder/.cabal \
            -v ~/.cabal:/home/builder/.cabal \
            -v /home/runner/work/_temp:/home/runner/work/_temp \
            -v ${{ github.workspace }}:/project \
            build/${{ matrix.os }}:latest

      - name: Compute cache key prefixes
        id: keys
        if: matrix.should_run == true && env.release != 'true'
        run: |
          toolchain=$(docker exec builder dpkg-query -W -f '${db:Status-Status} ${binary:Package} ${Version}\n' 'binutils*' 'cpp*' 'gcc*' '*-dev' | grep '^installed ' | sha256sum | cut -c1-16)
          target=ubuntu-${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-$toolchain
          echo "deps=deps-$target" >> "$GITHUB_OUTPUT"
          echo "dist=dist-$target" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies from cache
        id: restore-deps
        if: matrix.should_run == true && env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cabal/store
          key: ${{ steps.keys.outputs.deps }}-${{ env.branch }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.deps }}-${{ env.branch }}-
            ${{ steps.keys.outputs.deps }}-

      - name: Warn if dependencies not in cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-deps.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::${{ steps.keys.outputs.deps }}-${{ env.branch }}"

      - name: Restore source repositories from cache
        id: restore-src
        if: matrix.should_run == true && env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: dist-newstyle/src
          key: src-${{ runner.os }}-${{ hashFiles('cabal.project') }}
          restore-keys: src-${{ runner.os }}-

      - name: Warn if source repositories not in cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-src.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::src-${{ runner.os }}"

      - name: Restore build directory from cache
        id: restore-build
        if: matrix.should_run == true && env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}-
            ${{ steps.keys.outputs.dist }}-${{ env.opt }}-

      - name: Warn if build directory not in cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-build.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}"

      - name: Set old timestamps on unchanged sources (GHC 8.10.7)
        if: matrix.ghc == '8.10.7' && steps.restore-build.outputs.cache-matched-key != '' && hashFiles(env.source_hashes) != ''
        run: scripts/ci/source-timestamps.sh restore ${{ env.source_hashes }}

      - name: Prepare cabal.project.local
        if: matrix.should_run == true
        shell: bash
        run: |
          echo "ignore-project: False"    >> cabal.project.local
          echo "package direct-sqlcipher" >> cabal.project.local
          echo "    flags: +openssl"      >> cabal.project.local

      - name: Build CLI
        id: build-cli
        if: matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          scripts/ci/prune-old-builds.sh dist-newstyle
          cabal update
          cabal build -j --enable-tests ${{ env.ghc_options }}
          mkdir -p /out
          for i in popopx-chat popopx-chat-test; do
            bin=$(find /project/dist-newstyle -name "$i" -type f -executable)
            chmod +x "$bin"
            cp "$bin" /out/
          done
          strip /out/popopx-chat

      - name: Record source hashes (GHC 8.10.7)
        if: matrix.should_run == true && matrix.ghc == '8.10.7'
        shell: docker exec -t builder sh -eu {0}
        run: scripts/ci/source-timestamps.sh record ${{ env.source_hashes }}

      - name: Compute dependency cache key
        id: hash-deps
        if: matrix.should_run == true && env.release != 'true'
        shell: bash
        run: echo "hash=$(ls ~/.cabal/store/ghc-*/ | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save dependencies to cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-deps.outputs.cache-matched-key != format('{0}-{1}-{2}', steps.keys.outputs.deps, env.branch, steps.hash-deps.outputs.hash)
        uses: actions/cache/save@v4
        with:
          path: ~/.cabal/store
          key: ${{ steps.keys.outputs.deps }}-${{ env.branch }}-${{ steps.hash-deps.outputs.hash }}

      - name: Save source repositories to cache
        if: matrix.should_run == true && env.release != 'true' && matrix.arch == 'x86_64' && steps.restore-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist-newstyle/src
          key: src-${{ runner.os }}-${{ hashFiles('cabal.project') }}

      - name: Save build directory to cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}-${{ github.sha }}

      - name: Build CLI deb
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          version=${{ github.ref }}
          version=${version#refs/tags/v}
          version=${version%-*}

          ./scripts/desktop/build-cli-deb.sh "$version"

      - name: Copy tests from container
        if: matrix.should_run == true
        shell: bash
        run: |
          docker cp builder:/out/popopx-chat-test .

      - name: Copy CLI from container and prepare it
        id: linux_cli_prepare
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        shell: bash
        run: |
          cli_name="popopx-chat-ubuntu-${{ matrix.os_underscore }}-${{ matrix.arch }}"
          cli_deb_name="${cli_name}.deb"
          cli_path="${{ github.workspace }}"

          docker cp builder:/out/popopx-chat "./${cli_name}"
          docker cp builder:/out/deb-build/popopx-chat.deb "./${cli_deb_name}"

          echo "bin_name=${cli_name}" >> $GITHUB_OUTPUT
          echo "bin_path=${cli_path}/${cli_name}" >> $GITHUB_OUTPUT

          echo "deb_name=${cli_deb_name}" >> $GITHUB_OUTPUT
          echo "deb_path=${cli_path}/${cli_deb_name}" >> $GITHUB_OUTPUT

      - name: Upload CLI
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        uses: ./.github/actions/prepare-release
        with:
          bin_name: ${{ steps.linux_cli_prepare.outputs.bin_name }}
          bin_path: ${{ steps.linux_cli_prepare.outputs.bin_path }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI deb
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        uses: ./.github/actions/prepare-release
        with:
          bin_name: ${{ steps.linux_cli_prepare.outputs.deb_name }}
          bin_path: ${{ steps.linux_cli_prepare.outputs.deb_path }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Desktop
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          export ASSETS_DIR='../../assets'
          scripts/desktop/make-deb-linux.sh

      - name: Prepare Desktop
        id: linux_desktop_build
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        shell: bash
        run: |
          path=$(echo ${{ github.workspace }}/apps/multiplatform/release/main/deb/popopx_${{ matrix.arch }}.deb )
          echo "package_path=$path" >> $GITHUB_OUTPUT

      - name: Upload Desktop
        uses: ./.github/actions/prepare-release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        with:
          bin_path: ${{ steps.linux_desktop_build.outputs.package_path }}
          bin_name: popopx-desktop-ubuntu-${{ matrix.os_underscore }}-${{ matrix.arch }}.deb
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AppImage
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == '22.04' && matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          export ASSETS_DIR='../../assets'
          scripts/desktop/make-appimage-linux.sh

      - name: Prepare AppImage
        id: linux_appimage_build
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == '22.04' && matrix.should_run == true
        shell: bash
        run: |
          path=$(find ${{ github.workspace }}/apps/multiplatform/release/main -maxdepth 1 -name '*.AppImage' -not -name 'appimagetool*' -print -quit)
          echo "appimage_path=$path" >> $GITHUB_OUTPUT

      - name: Upload AppImage
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == '22.04' && matrix.should_run == true
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.linux_appimage_build.outputs.appimage_path }}
          bin_name: "popopx-desktop-${{ matrix.arch }}.AppImage"
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mount RAM disk for tests
        if: matrix.should_run == true && matrix.arch == 'x86_64'
        shell: bash
        run: |
          mkdir -p tests/tmp
          sudo mount -t tmpfs -o size=2G tmpfs tests/tmp
          sudo chown $(id -u):$(id -g) tests/tmp

      - name: Run tests
        if: matrix.should_run == true && matrix.arch == 'x86_64'
        timeout-minutes: 120
        shell: bash
        env:
          TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.tests || '' }}
          PR_BODY: ${{ github.event.pull_request.draft == true && github.event.pull_request.body || '' }}
          ATTEMPTS: ${{ (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v')) && 3 || 1 }}
        run: scripts/ci/run-tests.sh timeout 35m ./popopx-chat-test

      # Compiling the desktop and Android targets of :common in parallel exceeds the 2 GB Kotlin daemon heap.
      # cmakeBuildAndCopy links the JNI library against libpopopx, which this job does not build.
      - name: Build and test Kotlin apps
        if: ${{ !cancelled() && matrix.kotlin == true }}
        timeout-minutes: 90
        shell: docker exec -t builder sh -eu {0}
        run: |
          cd apps/multiplatform
          ./gradlew --no-daemon --max-workers=1 \
            :common:desktopTest \
            :desktop:compileKotlinJvm -x :desktop:cmakeBuildAndCopy \
            :android:compileGoogleDebugKotlin \
            :android:testFossDebugUnitTest

      - name: Remove -O2 build directory
        id: remove-o2
        if: env.cache_o0 == 'true' && !cancelled() && steps.build-cli.outcome == 'success'
        shell: docker exec -t builder sh -eu {0}
        run: find dist-newstyle -mindepth 1 -maxdepth 1 ! -name src -exec rm -rf {} +

      - name: Restore -O0 build directory from cache
        id: restore-build-o0
        if: ${{ !cancelled() && steps.remove-o2.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-O0-${{ env.branch }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.dist }}-O0-${{ env.branch }}-
            ${{ steps.keys.outputs.dist }}-O0-

      - name: Set old timestamps on unchanged sources for -O0 build (GHC 8.10.7)
        if: ${{ !cancelled() && matrix.ghc == '8.10.7' && steps.restore-build-o0.outputs.cache-matched-key != '' && hashFiles(env.source_hashes) != '' }}
        run: scripts/ci/source-timestamps.sh restore ${{ env.source_hashes }}

      - name: Build at -O0 for pull request caches
        id: build-o0
        if: ${{ !cancelled() && steps.remove-o2.outcome == 'success' }}
        shell: docker exec -t builder sh -eu {0}
        run: |
          scripts/ci/prune-old-builds.sh dist-newstyle
          cabal build -j --enable-tests --ghc-options=-O0

      - name: Record source hashes for -O0 build (GHC 8.10.7)
        if: ${{ !cancelled() && matrix.ghc == '8.10.7' && steps.build-o0.outcome == 'success' }}
        shell: docker exec -t builder sh -eu {0}
        run: scripts/ci/source-timestamps.sh record ${{ env.source_hashes }}

      - name: Save -O0 build directory to cache
        if: ${{ !cancelled() && steps.build-o0.outcome == 'success' && steps.restore-build-o0.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-O0-${{ env.branch }}-${{ github.sha }}

  build-linux-full:
    name: "build-linux-full: ubuntu-${{ matrix.os }}-${{ matrix.arch }} (CLI,Desktop), GHC: ${{ matrix.ghc }}"
    timeout-minutes: 300
    needs: [maybe-release, variables]
    if: (needs.maybe-release.outputs.reduced != 'true' || needs.maybe-release.outputs.full == 'true') && (needs.maybe-release.outputs.haskell == 'true' || needs.maybe-release.outputs.kotlin == 'true')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    env:
      image_cache: ghcr.io/${{ github.repository_owner }}/popopx-chat-build-cache:${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}
      source_hashes: dist-newstyle/sources.sha256
    concurrency: *linux-concurrency
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 24.04
            os_underscore: 24_04
            arch: x86_64
            runner: "ubuntu-24.04"
            should_run: ${{ needs.maybe-release.outputs.haskell == 'true' }}
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            hash: 'sha256:98ff7968124952e719a8a69bb3cccdd217f5fe758108ac4f21ad22e1df44d237'
            kotlin: ${{ needs.maybe-release.outputs.kotlin == 'true' }}
    steps: *linux-steps

  build-linux-push:
    name: "build-linux-push: ubuntu-${{ matrix.os }}-${{ matrix.arch }} (CLI,Desktop), GHC: ${{ matrix.ghc }}"
    timeout-minutes: 300
    needs: [maybe-release, variables]
    # The aarch64 lane. Its ordinary gate stays "a real push", because that is the only moment the
    # registry cache is worth writing; a manual run_all or the weekly sweep may still run it, and neither
    # writes anything - the docker step's cache-to is non-empty only on a push to master.
    if: (needs.maybe-release.outputs.reduced != 'true' && github.event_name == 'push') || needs.maybe-release.outputs.full == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    env:
      image_cache: ghcr.io/${{ github.repository_owner }}/popopx-chat-build-cache:${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}
      source_hashes: dist-newstyle/sources.sha256
      cache_o0: false
    concurrency: *linux-concurrency
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 22.04
            os_underscore: 22_04
            arch: aarch64
            runner: "ubuntu-22.04-arm"
            should_run: true
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            hash: 'sha256:6a62a4157b8775eaf4959cb629e757d32d39d1f4c8ac1b0ddc2510b555cf72f3'
            kotlin: false
          - os: 24.04
            os_underscore: 24_04
            arch: aarch64
            runner: "ubuntu-24.04-arm"
            should_run: true
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            hash: 'sha256:68434214381cb38287104e629fe8ee720167dd98cbb36ab1cbbab342515fa6ab'
            kotlin: false
    steps: *linux-steps

  build-linux-ghc8:
    name: "build-linux-ghc8: ubuntu-${{ matrix.os }}-${{ matrix.arch }} (CLI,Desktop), GHC: ${{ matrix.ghc }}"
    timeout-minutes: 300
    needs: [maybe-release, variables]
    if: ${{ (needs.maybe-release.outputs.reduced != 'true' || needs.maybe-release.outputs.full == 'true') && needs.maybe-release.outputs.haskell == 'true' && !(github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    env:
      image_cache: ghcr.io/${{ github.repository_owner }}/popopx-chat-build-cache:${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}
      source_hashes: dist-newstyle/sources.sha256
      opt: O0
      ghc_options: --ghc-options=-O0
      cache_o0: false
    concurrency: *linux-concurrency
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 22.04
            os_underscore: 22_04
            arch: x86_64
            runner: "ubuntu-22.04"
            ghc: "8.10.7"
            hash: 'sha256:5c8b2c0a6c745bc177669abfaa716b4bc57d58e2ea3882fb5da67f4d59e3dda5'
            should_run: true
            kotlin: false
    steps: *linux-steps

# =========================
#        MacOS Build
# =========================

  build-macos:
    name: "build-macos: ${{ matrix.os }} (CLI,Desktop), GHC: ${{ matrix.ghc }}"
    timeout-minutes: 300
    needs: [maybe-release, variables, check-smp-links, check-brand-clean]
    # Nothing in this leg ever ran on this fork: it needs reduced=false, which only a tag push gives.
    # run_all and the weekly sweep open it, and every publishing step inside stays tag-gated, so a
    # non-release run builds and tests without touching a release.
    if: (needs.maybe-release.outputs.reduced != 'true' || needs.maybe-release.outputs.full == 'true') && needs.maybe-release.outputs.haskell == 'true'
    # Upload CLI and Upload Desktop attach to the app release through prepare-release, which is
    # given the job token; the default read-only token cannot write a release.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    env:
      # The two values that say who signs: kept at job level so the steps can be skipped when they are absent.
      APPLE_POPOPX_SIGNING_IDENTITY: ${{ secrets.APPLE_POPOPX_SIGNING_IDENTITY }}
      APPLE_POPOPX_NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_POPOPX_NOTARIZATION_TEAM_ID }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-macos-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: aarch64
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            cli_asset_name: popopx-chat-macos-aarch64
            desktop_asset_name: popopx-desktop-macos-aarch64.dmg
            openssl_dir: "/opt/homebrew/opt"
            should_run: ${{ needs.maybe-release.outputs.haskell == 'true' }}
          - os: macos-15-intel
            arch: x86_64
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            cli_asset_name: popopx-chat-macos-x86-64
            desktop_asset_name: popopx-desktop-macos-x86_64.dmg
            openssl_dir: "/usr/local/opt"
            should_run: ${{ needs.maybe-release.outputs.haskell == 'true' }}
    steps:
      - name: Checkout Code
        if: matrix.should_run == true
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Point Command Line Tools SDK to Xcode SDK
        if: matrix.should_run == true
        shell: bash
        run: sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      - name: Compute toolchain cache key
        id: toolchain-key
        if: matrix.should_run == true && env.release != 'true'
        shell: bash
        run: echo "key=ghcup-${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-cabal3.10.2.0-$({ sw_vers -productVersion; clang --version; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain from cache
        id: restore-toolchain
        if: matrix.should_run == true && env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ghcup/ghc/${{ matrix.ghc }}
            ~/.ghcup/bin/*-${{ matrix.ghc }}
            ~/.ghcup/bin/cabal-3.10.2.0
          key: ${{ steps.toolchain-key.outputs.key }}

      - name: Warn if toolchain not in cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-toolchain.outputs.cache-hit != 'true'
        run: echo "::warning title=Cache miss::${{ steps.toolchain-key.outputs.key }}"

      - name: Prepare build
        id: prepare
        if: matrix.should_run == true
        uses: ./.github/actions/prepare-build
        with:
          java_ver: ${{ needs.variables.outputs.JAVA_VER }}
          ghc_ver: ${{ matrix.ghc }}
          github_ref: ${{ github.ref }}

      - name: Save toolchain to cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ghcup/ghc/${{ matrix.ghc }}
            ~/.ghcup/bin/*-${{ matrix.ghc }}
            ~/.ghcup/bin/cabal-3.10.2.0
          key: ${{ steps.toolchain-key.outputs.key }}

      - name: Install OpenSSL
        if: matrix.should_run == true
        run: brew install openssl@3.0

      - name: Prepare cabal.project.local
        if: matrix.should_run == true
        shell: bash
        run: |
          echo "ignore-project: False"                                                    >> cabal.project.local
          echo "package popopxmq"                                                        >> cabal.project.local
          echo "    extra-include-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/include"    >> cabal.project.local
          echo "    extra-lib-dirs: ${{ matrix.openssl_dir}}/openssl@3.0/lib"             >> cabal.project.local
          echo ""                                                                         >> cabal.project.local
          echo "package direct-sqlcipher"                                                 >> cabal.project.local
          echo "    extra-include-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/include"    >> cabal.project.local
          echo "    extra-lib-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/lib"            >> cabal.project.local
          echo "    flags: +openssl"                                                      >> cabal.project.local

      - name: Compute cache key prefixes
        id: keys
        if: matrix.should_run == true && env.release != 'true'
        shell: bash
        run: |
          toolchain=$({ sw_vers -productVersion; clang --version; } | shasum -a 256 | cut -c1-16)
          target=${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-$toolchain
          echo "deps=deps-$target" >> "$GITHUB_OUTPUT"
          echo "dist=dist-$target" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies from cache
        id: restore-deps
        if: matrix.should_run == true && env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.prepare.outputs.cabal-store }}
          key: ${{ steps.keys.outputs.deps }}-${{ env.branch }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.deps }}-${{ env.branch }}-
            ${{ steps.keys.outputs.deps }}-

      - name: Warn if dependencies not in cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-deps.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::${{ steps.keys.outputs.deps }}-${{ env.branch }}"

      - name: Restore source repositories from cache
        id: restore-src
        if: matrix.should_run == true && env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: dist-newstyle/src
          key: src-${{ runner.os }}-${{ hashFiles('cabal.project') }}
          restore-keys: src-${{ runner.os }}-

      - name: Warn if source repositories not in cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-src.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::src-${{ runner.os }}"

      - name: Restore build directory from cache
        id: restore-build
        if: matrix.should_run == true && env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}-
            ${{ steps.keys.outputs.dist }}-${{ env.opt }}-

      - name: Warn if build directory not in cache
        if: matrix.should_run == true && steps.restore-build.outcome == 'success' && steps.restore-build.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}"

      - name: Build CLI
        id: mac_cli_build
        if: matrix.should_run == true
        shell: bash
        run: |
          scripts/ci/prune-old-builds.sh dist-newstyle
          cabal build -j --enable-tests ${{ env.ghc_options }}
          path=$(cabal list-bin popopx-chat | tail -n 1)
          echo "bin_path=$path" >> $GITHUB_OUTPUT

      - name: Compute dependency cache key
        id: hash-deps
        if: matrix.should_run == true && env.release != 'true'
        shell: bash
        run: echo "hash=$(ls '${{ steps.prepare.outputs.cabal-store }}'/ghc-*/ | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save dependencies to cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-deps.outputs.cache-matched-key != format('{0}-{1}-{2}', steps.keys.outputs.deps, env.branch, steps.hash-deps.outputs.hash)
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prepare.outputs.cabal-store }}
          key: ${{ steps.keys.outputs.deps }}-${{ env.branch }}-${{ steps.hash-deps.outputs.hash }}

      - name: Save source repositories to cache
        if: matrix.should_run == true && env.release != 'true' && matrix.arch == 'x86_64' && steps.restore-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist-newstyle/src
          key: src-${{ runner.os }}-${{ hashFiles('cabal.project') }}

      - name: Save build directory to cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}-${{ github.sha }}

      - name: Upload CLI
        if: matrix.should_run == true && startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.mac_cli_build.outputs.bin_path }}
          bin_name: ${{ matrix.cli_asset_name }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report unsigned desktop build
        if: matrix.should_run == true && startsWith(github.ref, 'refs/tags/v') && env.APPLE_POPOPX_SIGNING_IDENTITY == ''
        shell: bash
        run: |
          echo "::warning::APPLE_POPOPX_SIGNING_IDENTITY is not configured - publishing the macOS desktop dmg unsigned is not possible, so the step is skipped."
          echo "Set APPLE_POPOPX_SIGNING_IDENTITY and APPLE_POPOPX_NOTARIZATION_TEAM_ID (and the keychain, apple id and password) to build it."

      - name: Build Desktop
        id: mac_desktop_build
        if: matrix.should_run == true && startsWith(github.ref, 'refs/tags/v') && env.APPLE_POPOPX_SIGNING_IDENTITY != ''
        shell: bash
        env:
          APPLE_POPOPX_SIGNING_KEYCHAIN: ${{ secrets.APPLE_POPOPX_SIGNING_KEYCHAIN }}
          APPLE_POPOPX_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_POPOPX_NOTARIZATION_APPLE_ID }}
          APPLE_POPOPX_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_POPOPX_NOTARIZATION_PASSWORD }}
        run: |
          export ASSETS_DIR='../../assets'
          scripts/ci/build-desktop-mac.sh
          path=$(find $PWD/apps/multiplatform/release/main/dmg -name '*.dmg' -print -quit)
          echo "package_path=$path" >> $GITHUB_OUTPUT

      - name: Upload Desktop
        if: matrix.should_run == true && startsWith(github.ref, 'refs/tags/v') && env.APPLE_POPOPX_SIGNING_IDENTITY != ''
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.mac_desktop_build.outputs.package_path }}
          bin_name: ${{ matrix.desktop_asset_name }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mount RAM disk for tests
        if: matrix.should_run == true && matrix.arch == 'aarch64'
        shell: bash
        run: |
          disk=$(hdiutil attach -nomount ram://4194304 | tr -d '[:space:]')
          diskutil erasevolume APFS tests "$disk"
          ln -s /Volumes/tests tests/tmp

      - name: Run tests
        if: matrix.should_run == true && matrix.arch == 'aarch64'
        timeout-minutes: 120
        shell: bash
        env:
          TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.tests || '' }}
          PR_BODY: ${{ github.event.pull_request.draft == true && github.event.pull_request.body || '' }}
          # Two tries on a branch push, because the cross-instance notification-order cases flake here;
          # three on the release channel, as before. This is only sound now that "Schema dump verify and
          # overwrite schema dump" dumps to tests/tmp instead of rewriting the tracked chat_schema.sql -
          # otherwise attempt 2 compares the fixture against attempt 1's own output and passes on drift.
          ATTEMPTS: ${{ (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v')) && 3 || 2 }}
          # The command is `cabal test`, not the suite binary, so every hspec token has to travel as
          # --test-option=TOKEN before scripts/ci/run-tests.sh can hand it to the suite.
          TEST_OPT_PREFIX: --test-option=
        # This was a private copy of the retry loop in scripts/ci/run-tests.sh and it carried neither of
        # that script's guards: `cabal test` exits 0 when hspec runs nothing, the same green-that-ran-
        # nothing the Linux leg had until W1. One script now decides for both platforms.
        run: scripts/ci/run-tests.sh cabal test --test-show-details=direct ${{ env.ghc_options }}

      - name: Remove -O2 build directory
        id: remove-o2
        if: matrix.should_run == true && env.cache_o0 == 'true' && !cancelled() && steps.mac_cli_build.outcome == 'success'
        shell: bash
        run: find dist-newstyle -mindepth 1 -maxdepth 1 ! -name src -exec rm -rf {} +

      - name: Restore -O0 build directory from cache
        id: restore-build-o0
        if: ${{ !cancelled() && matrix.should_run == true && steps.remove-o2.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-O0-${{ env.branch }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.dist }}-O0-${{ env.branch }}-
            ${{ steps.keys.outputs.dist }}-O0-

      - name: Build at -O0 for pull request caches
        id: build-o0
        if: ${{ !cancelled() && matrix.should_run == true && steps.remove-o2.outcome == 'success' }}
        shell: bash
        run: |
          scripts/ci/prune-old-builds.sh dist-newstyle
          cabal build -j --enable-tests --ghc-options=-O0

      - name: Save -O0 build directory to cache
        if: ${{ !cancelled() && matrix.should_run == true && steps.build-o0.outcome == 'success' && steps.restore-build-o0.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-O0-${{ env.branch }}-${{ github.sha }}

  build-ios:
    name: "build-ios: macos-latest (iOS)"
    timeout-minutes: 150
    needs: [maybe-release, check-smp-links, check-brand-clean]
    if: needs.maybe-release.outputs.ios == 'true'
    runs-on: macos-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ios
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Point Command Line Tools SDK to Xcode SDK
        shell: bash
        run: sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      - name: Check the previews listed in the snapshot tests
        shell: bash
        run: python3 "apps/ios/POPOPX Snapshots/check-previews.py"

      # The mesh module's two SwiftPM test targets had never been executed anywhere: no workflow in this
      # repository contained `swift test` or `xcodebuild test`, so every commit to them was merged on the
      # strength of a compile. They build for macOS, which is why this is here and not in a Linux job.
      #
      # 368 of the 412 tests run (measured 2026-11-27, after the 33 Node wire cases landed; both totals
      # come from summing the Swift-Testing "Test run with N tests" lines, since the XCTest bridge lines
      # below them all read 0). The 44 that do not are the ones that call PopopxMeshFileStore.write,
      # which passes `.completeFileProtection` (PopopxMeshStorage.swift:112): macOS has no per-file
      # protection classes, so every directory on the volume rejects it with EPERM - measured at 4/4
      # probe sites (temporaryDirectory, ~/Documents, ~/Library/Containers, /Users/Shared) with
      # FileVault on, and reproduced as 20 failing tests at 3daec259e before this job existed. They are
      # skipped by name, not deleted: renaming or adding a storage-writing test stops the skip matching
      # and turns this step red, which is the loud direction. The alternative that would run them - an
      # iOS-simulator test lane - needs a scheme configured for the test action, and the package schemes
      # generated from POPOPX.xcodeproj are not ("Scheme PopopxMeshKit is not currently configured for
      # the test action"), so it is a project-file change and not this job's to make.
      - name: Run the mesh package tests
        timeout-minutes: 20
        shell: bash
        run: |
          SKIP='PopopxMeshGroupTests|PopopxMeshPendingForwardTests'
          SKIP="$SKIP|queuePersistsAcrossRouters|pairingSurvivesRelaunchWithEmptyQueue"
          SKIP="$SKIP|PopopxMeshNicknameStoreTests|PopopxMeshGroupsModelTests"
          SKIP="$SKIP|nicknameRoundTrip|nicknameIsTheSameFileThePlazaUses"
          SKIP="$SKIP|nicknameChangeRestartsWithNewName"
          out=$(swift test --package-path apps/ios/PopopxMeshKit --skip "$SKIP" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          total=$(echo "$out" | sed -n 's/.*Test run with \([0-9]*\) tests.*/\1/p' | paste -sd+ - | bc)
          # A gate whose regex matched nothing would still exit 0 and report two green runs - the same
          # class of false green as the hspec short-circuit; 368 is what this suite measures today, and
          # 300 is the floor that says the tests were selected at all.
          total=${total:-0}
          [ "$total" -ge 300 ] || { echo "only $total mesh tests ran, expected 335"; exit 1; }
          echo "mesh package tests: $total executed, all passing"

      # apps/macos/PopopxTorKit - the macOS client's embedded Tor engine - had never been tested in CI
      # either, and this is the only macOS job that runs on a branch push. It is deliberately not a
      # build-macos step: that leg waits for a tag, and 85 unit tests should not.
      #
      # XCTest, not Swift Testing: `@Test` appears nowhere in this package, so the mesh step's
      # "Test run with N tests" parse would read zero. XCTest prints an "Executed N tests" line per class
      # and the 'All tests' total, so the maximum is the total - and a run that selected nothing prints
      # "Executed 0 tests" and still exits 0, which is exactly the vacuous pass this guard exists for.
      - name: Run the Tor routing kit tests
        timeout-minutes: 20
        shell: bash
        run: |
          out=$(swift test --package-path apps/macos/PopopxTorKit 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          total=$(echo "$out" | sed -n 's/.*Executed \([0-9]*\) tests, with.*/\1/p' | sort -n | tail -n 1)
          total=${total:-0}
          [ "$total" -ge 80 ] || { echo "only $total TorKit tests ran, expected 85"; exit 1; }
          echo "PopopxTorKit tests: $total executed, all passing"

      - name: Build iOS app
        timeout-minutes: 60
        shell: bash
        run: |
          scripts/ci/ios-stub-libs.sh
          scripts/ci/ios-stub-mlpackage.sh
          # Every target sets IPHONEOS_DEPLOYMENT_TARGET = $(RECOMMENDED_IPHONEOS_DEPLOYMENT_TARGET),
          # which resolves to 15.0 on Xcode 26 and 17.0 on Xcode 27. The sources use @Observable and
          # NavigationStack, so pin the floor the code actually requires.
          xcodebuild build -quiet \
            -project apps/ios/POPOPX.xcodeproj \
            -scheme "POPOPX (iOS)" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

# =========================
#      Windows Build
# =========================

  build-windows:
    name: "build-windows: ${{ matrix.os }} (CLI,Desktop), GHC: ${{ matrix.ghc }}"
    timeout-minutes: 300
    needs: [maybe-release, variables, check-smp-links, check-brand-clean]
    # Same shape as build-macos: opened by run_all or the weekly sweep, and the msi/upload steps stay
    # tag-gated. Unlike build-macos this leg has no "Run tests" step at all, so a green run here proves
    # the CLI compiles and links - not that the suite passes on Windows.
    if: (needs.maybe-release.outputs.reduced != 'true' || needs.maybe-release.outputs.full == 'true') && needs.maybe-release.outputs.haskell == 'true'
    # Upload CLI and Upload Desktop attach to the app release through prepare-release, which is
    # given the job token; the default read-only token cannot write a release.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-windows-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ghc: ${{ needs.variables.outputs.GHC_VER }}
            cli_asset_name: popopx-chat-windows-x86-64
            desktop_asset_name: popopx-desktop-windows-x86_64.msi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare build
        id: prepare
        uses: ./.github/actions/prepare-build
        with:
          java_ver: ${{ needs.variables.outputs.JAVA_VER }}
          ghc_ver: ${{ matrix.ghc }}
          github_ref: ${{ github.ref }}

      - name: Configure pagefile (Windows)
        uses: popopx-chat/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"
  
      - name: 'Setup MSYS2'
        uses: simplex-chat/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            perl
            make
            zip
          pacboy: >-
            toolchain:p
            cmake:p

      - name: Compute cache key prefixes
        id: keys
        if: env.release != 'true'
        shell: msys2 {0}
        run: |
          toolchain=$(gcc --version | sha256sum | cut -c1-16)
          target=windows-x86_64-ghc${{ matrix.ghc }}-$toolchain
          echo "deps=deps-$target" >> "$GITHUB_OUTPUT"
          echo "dist=dist-$target" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies from cache
        id: restore-deps
        if: env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.prepare.outputs.cabal-store }}
          key: ${{ steps.keys.outputs.deps }}-${{ env.branch }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.deps }}-${{ env.branch }}-
            ${{ steps.keys.outputs.deps }}-

      - name: Warn if dependencies not in cache
        if: env.release != 'true' && steps.restore-deps.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::${{ steps.keys.outputs.deps }}-${{ env.branch }}"

      - name: Restore source repositories from cache
        id: restore-src
        if: env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: dist-newstyle/src
          key: src-${{ runner.os }}-${{ hashFiles('cabal.project') }}
          restore-keys: src-${{ runner.os }}-

      - name: Warn if source repositories not in cache
        if: env.release != 'true' && steps.restore-src.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::src-${{ runner.os }}"

      - name: Restore build directory from cache
        id: restore-build
        if: env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}-
            ${{ steps.keys.outputs.dist }}-${{ env.opt }}-

      - name: Warn if build directory not in cache
        if: steps.restore-build.outcome == 'success' && steps.restore-build.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}"

      # rm -rf dist-newstyle/src/{direct-sq,popopxmq,hs-jpeg-t,JuicyPixe}* is here because of the bug in cabal's dependency which prevents second build from finishing
      # (popopxmq, hs-jpeg-turbo and JuicyPixels-stbir are removed because cabal cannot delete their read-only git submodule pack files - blst, libbbs, mozjpeg, stb - on Windows)
      - name: Build CLI
        id: windows_cli_build
        shell: msys2 {0}
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          scripts/desktop/prepare-openssl-windows.sh
          openssl_windows_style_path=$(echo `pwd`/dist-newstyle/openssl-3.0.15 | sed 's#/\([a-zA-Z]\)#\1:#' | sed 's#/#\\#g')
          rm cabal.project.local 2>/dev/null || true
          echo "ignore-project: False" >> cabal.project.local
          echo "package direct-sqlcipher" >> cabal.project.local
          echo "    flags: +openssl" >> cabal.project.local
          echo "    extra-include-dirs: $openssl_windows_style_path\include" >> cabal.project.local
          echo "    extra-lib-dirs: $openssl_windows_style_path" >> cabal.project.local

          scripts/ci/prune-old-builds.sh dist-newstyle
          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/popopxmq* dist-newstyle/src/hs-jpeg-t* dist-newstyle/src/JuicyPixe*
          sed -i "s/, unix /--, unix /" popopx-chat.cabal
          cabal build -j --enable-tests ${{ env.ghc_options }}
          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/popopxmq* dist-newstyle/src/hs-jpeg-t* dist-newstyle/src/JuicyPixe*
          path=$(cabal list-bin popopx-chat | tail -n 1)
          echo "bin_path=$path" >> $GITHUB_OUTPUT

      - name: Compute dependency cache key
        id: hash-deps
        if: env.release != 'true'
        shell: msys2 {0}
        run: echo "hash=$(ls "$(cygpath -u '${{ steps.prepare.outputs.cabal-store }}')"/ghc-*/ | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save dependencies to cache
        if: env.release != 'true' && steps.restore-deps.outputs.cache-matched-key != format('{0}-{1}-{2}', steps.keys.outputs.deps, env.branch, steps.hash-deps.outputs.hash)
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prepare.outputs.cabal-store }}
          key: ${{ steps.keys.outputs.deps }}-${{ env.branch }}-${{ steps.hash-deps.outputs.hash }}

      - name: Save source repositories to cache
        if: env.release != 'true' && steps.restore-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist-newstyle/src
          key: src-${{ runner.os }}-${{ hashFiles('cabal.project') }}

      - name: Save build directory to cache
        if: env.release != 'true' && steps.restore-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-${{ env.opt }}-${{ env.branch }}-${{ github.sha }}

      - name: Upload CLI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.windows_cli_build.outputs.bin_path }}
          bin_name: ${{ matrix.cli_asset_name }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Desktop
        id: windows_desktop_build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: msys2 {0}
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          scripts/desktop/build-lib-windows.sh
          cd apps/multiplatform
          ./gradlew -Ppopopx.assets.dir=../../assets packageMsi
          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/popopxmq* dist-newstyle/src/hs-jpeg-t* dist-newstyle/src/JuicyPixe*
          path=$(find $PWD/release/main/msi -name '*.msi' -print -quit | sed 's#/\([a-z]\)#\1:#' | sed 's#/#\\#g')
          echo "package_path=$path" >> $GITHUB_OUTPUT

      - name: Upload Desktop
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/prepare-release
        with:
          bin_path: ${{ steps.windows_desktop_build.outputs.package_path }}
          bin_name: ${{ matrix.desktop_asset_name }}
          github_ref: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove -O2 build directory
        id: remove-o2
        if: env.cache_o0 == 'true' && !cancelled() && steps.windows_cli_build.outcome == 'success'
        shell: msys2 {0}
        run: find dist-newstyle -mindepth 1 -maxdepth 1 ! -name src -exec rm -rf {} +

      - name: Restore -O0 build directory from cache
        id: restore-build-o0
        if: ${{ !cancelled() && steps.remove-o2.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-O0-${{ env.branch }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.dist }}-O0-${{ env.branch }}-
            ${{ steps.keys.outputs.dist }}-O0-

      - name: Build at -O0 for pull request caches
        id: build-o0
        if: ${{ !cancelled() && steps.remove-o2.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          scripts/desktop/prepare-openssl-windows.sh
          scripts/ci/prune-old-builds.sh dist-newstyle
          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/popopxmq* dist-newstyle/src/hs-jpeg-t* dist-newstyle/src/JuicyPixe*
          cabal build -j --enable-tests --ghc-options=-O0
          rm -rf dist-newstyle/src/direct-sq* dist-newstyle/src/popopxmq* dist-newstyle/src/hs-jpeg-t* dist-newstyle/src/JuicyPixe*

      - name: Save -O0 build directory to cache
        if: ${{ !cancelled() && steps.build-o0.outcome == 'success' && steps.restore-build-o0.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            dist-newstyle/*
            !dist-newstyle/src
          key: ${{ steps.keys.outputs.dist }}-O0-${{ env.branch }}-${{ github.sha }}

# =========================
#   Releases and packages
# =========================

# Every asset's SHA-256 is written by this one job, after all the legs that upload have finished.
# Each leg used to append its own line through ./.github/actions/prepare-release, and that action
# reads the release body, edits it and writes it back - with 16 jobs in parallel it lost 2 of the
# 16 lines on v7.1.2-popopx.1. GitHub records a digest for every uploaded asset, so the hashes
# need no download and no lock. !cancelled() so a partial release still lists what it does have.
#
# This is the one job the run_all switch deliberately does NOT open: it looks the release up by
# GITHUB_REF_NAME, so off a tag the first call 404s and the job can only ever be red. Its reach is
# therefore the tag itself - re-running the tag push's jobs is how a release note gets repaired.

  release-hashes:
    name: "Add asset hashes to release notes"
    timeout-minutes: 30
    needs: [build-linux, build-macos, build-windows]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Rewrite the release body with every asset digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}/releases"
          id=$(gh api "${api}/tags/${GITHUB_REF_NAME}" --jq .id)
          gh api --paginate "${api}/${id}/assets" \
            -q '.[] | "SHA2-256(\(.name))= \(.digest | sub("^sha256:"; ""))"' | sort > hashes.txt
          { cat .github/release_body.md; echo; cat hashes.txt; } > body.md
          jq -Rs '{body: .}' body.md | gh api -X PATCH "${api}/${id}" --input -

# =============================
#       Aggregate verdict
# =============================

# Branch protection can only require a check whose name is a stable string. Every build leg here is a
# matrix job, and a matrix job that never expands reports under its *unexpanded* title - literally
# "build-macos: ${{ matrix.os }} (CLI,Desktop), GHC: ${{ matrix.ghc }}" - so none of them can be pinned,
# and on a daily push that placeholder is the only name five of the six heavy legs ever get. This job
# has no matrix of its own, so "CI Gate" is the same string on push, on schedule and on dispatch alike.
  ci-gate:
    name: "CI Gate"
    # always(): the verdict has to be published even when a leg failed. Without it this job is skipped
    # along with its inputs, and a required check that never reports blocks the branch forever.
    if: always()
    needs: [variables, maybe-release, check-smp-links, check-brand-clean, build-linux, build-ios,
            build-macos, build-windows, build-linux-full, build-linux-push, build-linux-ghc8, release-hashes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The table is read entirely from the needs context, so this job gets no token at all.
    permissions: {}
    steps:
      - name: Aggregate every leg
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # These four carry no `if:` of their own, so a "skipped" one of them can only mean a job ahead
          # of them died and its skip is hiding that. Every other leg may be skipped on purpose: that is
          # exactly how a daily push differs from a full sweep, and how the tag-only legs stay silent.
          mandatory=" variables maybe-release check-smp-links check-brand-clean "
          rows=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' | sort)
          printf 'leg results:\n%s\n' "$rows"
          bad=""
          while IFS=$'\t' read -r job result; do
            case "$mandatory" in *" $job "*) required=yes ;; *) required=no ;; esac
            if [ "$result" = success ]; then
              continue
            fi
            if [ "$result" = skipped ] && [ "$required" = no ]; then
              continue
            fi
            bad+="$job=$result "
          done <<< "$rows"
          if [ -n "$bad" ]; then
            echo "::error::CI Gate red:${bad}"
            echo "A mandatory leg that was skipped means something before it failed; failing legs are named above."
            exit 1
          fi
          echo "CI Gate green: every leg that ran succeeded, the rest were skipped by their own gate."
